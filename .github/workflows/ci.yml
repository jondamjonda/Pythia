name: ci

# Fast checks that need no services. The engine's database-backed suite runs locally against the
# populated legal corpus (Postgres + pgvector); see engine/docs/REBUILD.md for restoring it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (lint + guardrail tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + dev, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check pythia train tests scripts eval
          ruff format --check pythia train tests scripts eval
      - name: Database-free tests
        # Import boundary, scheduler entry point, checkpoint manifest, flag registry.
        run: |
          pytest -q \
            tests/test_nexus_port_boundary.py \
            tests/test_maintenance_and_repro.py \
            tests/test_flip_gate_registry.py

  app:
    name: app backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check src tests apps scripts
          ruff format --check src tests apps scripts
      - name: Tests
        # Database-backed tests skip themselves when Postgres is not reachable.
        run: pytest -q

  frontend:
    name: frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
